<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Cuenta - NodeWeaver</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/theme.css?v=10" />
    <link rel="stylesheet" href="../../css/auth.css?v=10" />
  </head>
  <body>
    <div class="auth-card wide">
      <div class="auth-header">
        <i class="fas fa-bolt auth-logo"></i>
        <h2>Crear tu cuenta</h2>
        <p>Empieza a automatizar en segundos</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="register-grid">
          <div class="mb-2">
            <label class="form-label">Nombre completo</label>
            <div class="position-relative">
              <i class="fas fa-user input-icon"></i>
              <input
                type="text"
                class="form-control input-with-icon"
                id="name"
                placeholder="Juan Pérez"
                required
              />
            </div>
            <div class="error-message" id="nameError">
              El nombre es requerido
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label">Email</label>
            <div class="position-relative">
              <i class="fas fa-envelope input-icon"></i>
              <input
                type="email"
                class="form-control input-with-icon"
                id="email"
                placeholder="tu@email.com"
                required
              />
            </div>
            <div class="error-message" id="emailError">Email inválido</div>
          </div>
          <div class="mb-2">
            <label class="form-label">Empresa (Opcional)</label>
            <div class="position-relative">
              <i class="fas fa-building input-icon"></i>
              <input
                type="text"
                class="form-control input-with-icon"
                id="company"
                placeholder="Mi Empresa S.L."
              />
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label">Teléfono (Opcional)</label>
            <div class="position-relative">
              <i class="fas fa-phone input-icon"></i>
              <input
                type="tel"
                class="form-control input-with-icon"
                id="phone"
                placeholder="+34 600 000 000"
              />
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label">Contraseña</label>
            <div class="position-relative">
              <i class="fas fa-lock input-icon"></i>
              <input
                type="password"
                class="form-control input-with-icon"
                id="password"
                placeholder="Mínimo 6"
                required
              />
              <i
                class="fas fa-eye password-toggle"
                onclick="togglePassword('password')"
              ></i>
            </div>
            <div class="password-strength">
              <div class="strength-bar" id="strengthBar"></div>
            </div>
            <div class="strength-text" id="strengthText">Muy débil</div>
            <div class="error-message" id="passwordError">
              Mín. 6 caracteres
            </div>
          </div>

          <div class="mb-0">
            <label class="form-label">Confirmar contraseña</label>
            <div class="position-relative">
              <i class="fas fa-lock input-icon"></i>
              <input
                type="password"
                class="form-control input-with-icon"
                id="confirmPassword"
                placeholder="Repite contraseña"
                required
              />
              <i
                class="fas fa-eye password-toggle"
                onclick="togglePassword('confirmPassword')"
              ></i>
            </div>
            <div class="error-message" id="confirmError">No coinciden</div>
            <div class="success-message" id="confirmSuccess">✓ Coinciden</div>
          </div>
        </div>

        <div class="terms-check">
          <input type="checkbox" id="terms" required />
          <label for="terms">
            Acepto los <a href="#" target="_blank">Términos y Condiciones</a> y
            la
            <a href="#" target="_blank">Política de Privacidad</a>
          </label>
        </div>
        <div
          class="error-message"
          id="termsError"
          style="margin-top: -10px; margin-bottom: 10px"
        >
          Debes aceptar los términos
        </div>

        <button type="submit" class="btn-auth mb-2" id="submitBtn">
          <i class="fas fa-user-plus me-2"></i>Crear cuenta gratis
        </button>

        <div class="divider">
          <span>o</span>
        </div>

        <button type="button" class="btn-google" onclick="loginWithGoogle()">
          <i class="fab fa-google"></i>
          Registrarse con Google
        </button>
      </form>

      <div class="auth-footer">
        ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
      </div>
    </div>

    <div id="notification-container" class="notification-container"></div>

    <script>
      // Configuración
      const API_URL = "../../../backend/public/index.php?route=auth/register";
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const companyInput = document.getElementById("company");
      const phoneInput = document.getElementById("phone");
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirmPassword");
      const termsCheck = document.getElementById("terms");
      const submitBtn = document.getElementById("submitBtn");

      // Toggle contraseña
      function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = event.target;
        if (field.type === "password") {
          field.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          field.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      // Para ver si la contraseña es segura o una castaña
      passwordInput.addEventListener("input", function () {
        const password = this.value;
        const strengthBar = document.getElementById("strengthBar");
        const strengthText = document.getElementById("strengthText");

        let strength = 0;
        let color = "#f44336";
        let text = "Muy débil";

        if (password.length >= 6) strength += 1;
        if (password.length >= 10) strength += 1;
        if (/[A-Z]/.test(password)) strength += 1;
        if (/[0-9]/.test(password)) strength += 1;
        if (/[^A-Za-z0-9]/.test(password)) strength += 1;

        switch (strength) {
          case 0:
          case 1:
            color = "#f44336";
            text = "Muy débil";
            break;
          case 2:
            color = "#ff9800";
            text = "Débil";
            break;
          case 3:
            color = "#ffc107";
            text = "Media";
            break;
          case 4:
            color = "#4caf50";
            text = "Fuerte";
            break;
          case 5:
            color = "#00c853";
            text = "Muy fuerte";
            break;
        }

        strengthBar.style.width = strength * 20 + "%";
        strengthBar.style.backgroundColor = color;
        strengthText.textContent = text;
        strengthText.style.color = color;
      });

      // Comprobamos que las contraseñas sean iguales
      function validatePasswordMatch() {
        const password = passwordInput.value;
        const confirm = confirmInput.value;
        const confirmError = document.getElementById("confirmError");
        const confirmSuccess = document.getElementById("confirmSuccess");

        if (confirm.length === 0) {
          confirmError.classList.remove("show");
          confirmSuccess.classList.remove("show");
          return false;
        }

        if (password === confirm) {
          confirmError.classList.remove("show");
          confirmSuccess.classList.add("show");
          return true;
        } else {
          confirmError.classList.add("show");
          confirmSuccess.classList.remove("show");
          return false;
        }
      }

      passwordInput.addEventListener("keyup", validatePasswordMatch);
      confirmInput.addEventListener("keyup", validatePasswordMatch);

      // Validamos el email sobre la marcha
      emailInput.addEventListener("input", function () {
        const email = this.value;
        const emailError = document.getElementById("emailError");
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (email.length > 0 && !emailRegex.test(email)) {
          emailError.classList.add("show");
          this.classList.add("input-error");
        } else {
          emailError.classList.remove("show");
          this.classList.remove("input-error");
        }
      });

      // Cuando le dan a enviar
      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          // Resetear errores
          document
            .querySelectorAll(".error-message")
            .forEach((el) => el.classList.remove("show"));
          document
            .querySelectorAll(".form-control")
            .forEach((el) => el.classList.remove("input-error"));

          let isValid = true;

          // Validar nombre
          if (!nameInput.value.trim()) {
            document.getElementById("nameError").classList.add("show");
            nameInput.classList.add("input-error");
            isValid = false;
          }

          // Validar email
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(emailInput.value)) {
            document.getElementById("emailError").classList.add("show");
            emailInput.classList.add("input-error");
            isValid = false;
          }

          // Validar contraseña
          if (passwordInput.value.length < 6) {
            document.getElementById("passwordError").classList.add("show");
            passwordInput.classList.add("input-error");
            isValid = false;
          }

          // Validar coincidencia
          if (passwordInput.value !== confirmInput.value) {
            document.getElementById("confirmError").classList.add("show");
            confirmInput.classList.add("input-error");
            isValid = false;
          }

          // Validar términos
          if (!termsCheck.checked) {
            document.getElementById("termsError").classList.add("show");
            isValid = false;
          }

          if (!isValid) {
            showNotification("Por favor, corrige los errores", "error");
            return;
          }

          // Mostrar carga
          submitBtn.disabled = true;
          submitBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin me-2"></i>Creando cuenta...';

          showNotification("Creando tu cuenta...", "info");

          try {
            const response = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                name: nameInput.value.trim(),
                email: emailInput.value.trim(),
                password: passwordInput.value,
                company_name: companyInput.value.trim(),
                phone: phoneInput.value.trim(),
              }),
            });

            const data = await response.json();

            if (data.success) {
              // Guardar token y usuario
              localStorage.setItem("token", data.token);
              localStorage.setItem("user", JSON.stringify(data.user));

              showNotification(
                "¡Cuenta creada con éxito! Redirigiendo...",
                "success",
              );

              // Redirigir al dashboard
              setTimeout(() => {
                window.location.href = "../dashboard.html";
              }, 2000);
            } else {
              showNotification(
                data.message || "Error al crear la cuenta",
                "error",
              );
              submitBtn.disabled = false;
              submitBtn.innerHTML =
                '<i class="fas fa-user-plus me-2"></i>Crear cuenta gratis';
            }
          } catch (error) {
            console.error("Error:", error);
            showNotification("Error de conexión", "error");
            submitBtn.disabled = false;
            submitBtn.innerHTML =
              '<i class="fas fa-user-plus me-2"></i>Crear cuenta gratis';
          }
        });

      // Login con Google
      function loginWithGoogle() {
        showNotification("Redirigiendo a Google...", "info");

        // En producción, usar CLIENT_ID real
        const GOOGLE_CLIENT_ID = "TU_CLIENT_ID_AQUI.apps.googleusercontent.com";
        const redirectUri = encodeURIComponent(
          "http://localhost/NodeWeaver/pages/auth/google-callback.html",
        );

        const url = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CLIENT_ID}&redirect_uri=${redirectUri}&response_type=token&scope=email%20profile%20openid`;

        window.location.href = url;
      }

      // Las notificaciones esas bonitas
      function showNotification(message, type = "info") {
        const container = document.getElementById("notification-container");
        const notification = document.createElement("div");
        notification.className = `notification ${type}`;

        const icon = {
          success: "fa-check-circle",
          error: "fa-exclamation-circle",
          info: "fa-info-circle",
        }[type];

        notification.innerHTML = `
                <i class="fas ${icon}"></i>
                <span>${message}</span>
            `;

        container.appendChild(notification);

        setTimeout(() => {
          notification.style.animation = "slideOut 0.3s ease";
          setTimeout(() => notification.remove(), 300);
        }, 3000);
      }
    </script>
  </body>
</html>
