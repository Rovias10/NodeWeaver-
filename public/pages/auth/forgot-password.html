<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña - NodeWeaver</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/theme.css" />
    <link rel="stylesheet" href="../../css/auth.css" />
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-header">
        <i class="fas fa-bolt auth-logo"></i>
        <h2>Recuperar contraseña</h2>
        <p>Te enviaremos instrucciones a tu email</p>
      </div>

      <div id="successMessage" class="success-box">
        <i class="fas fa-check-circle me-2"></i>
        <span>Si el email existe, recibirás instrucciones</span>
      </div>

      <form id="forgotForm">
        <div class="mb-4">
          <label class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="tu@email.com"
            required
          />
        </div>

        <button type="submit" class="btn-auth mb-3">
          <i class="fas fa-paper-plane me-2"></i>Enviar instrucciones
        </button>
      </form>

      <div class="auth-footer">
        <a href="login.html"
          ><i class="fas fa-arrow-left me-2"></i>Volver al inicio de sesión</a
        >
      </div>
    </div>

    <div id="notification-container" class="notification-container"></div>

    <script>
      document
        .getElementById("forgotForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;

          showNotification("Enviando instrucciones...", "info");

          try {
            const response = await fetch(
              "../../../backend/public/index.php?route=auth/forgot-password",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email }),
              },
            );

            const data = await response.json();

            if (data.success) {
              document.getElementById("successMessage").classList.add("show");
              document.getElementById("forgotForm").style.display = "none";
            } else {
              showNotification(data.message, "error");
            }
          } catch (error) {
            showNotification("Error de conexión", "error");
          }
        });

      function showNotification(message, type = "info") {
        const container = document.getElementById("notification-container");
        const notification = document.createElement("div");
        notification.className = `notification ${type}`;

        const icon = {
          success: "fa-check-circle",
          error: "fa-exclamation-circle",
          info: "fa-info-circle",
        }[type];

        notification.innerHTML = `
                <i class="fas ${icon}"></i>
                <span>${message}</span>
            `;

        container.appendChild(notification);

        setTimeout(() => {
          notification.style.animation = "slideOut 0.3s ease";
          setTimeout(() => notification.remove(), 300);
        }, 3000);
      }
    </script>
  </body>
</html>
