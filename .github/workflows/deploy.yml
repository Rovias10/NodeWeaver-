name: Deploy a IONOS Hosting Plus

# Pipeline de despliegue de StudyWeaver. Cada push a `main` reconstruye
# el frontend, instala las dependencias PHP del backend y sube ambos
# artefactos por FTPS a los dos document roots correspondientes en IONOS.
#
# Configuración previa (una sola vez):
#   - Secrets en GitHub: SFTP_HOST, SFTP_USER, SFTP_PASSWORD.
#   - .env de producción ya en el servidor (subido a mano por SFTP).
#   - Carpetas uploads/ creadas con permisos 755 en el servidor.
#   - DocumentRoot del subdominio api.villanuevarodrigo.com → /api.villanuevarodrigo.com/public/.
#
# Ver docs/despliegue.md y ADR-09 para el detalle.

on:
  push:
    branches: [main]
  # Disparo manual desde la pestaña Actions, útil para forzar un redeploy
  # sin tener que hacer un commit cosmético.
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Frontend: build de producción con Vite.
      # ---------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        # `npm ci` exige lockfile y construye desde cero respetando las
        # versiones exactas — builds reproducibles entre dev y CI.
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build del frontend (Vite -> dist/)
        working-directory: frontend
        # Vite carga frontend/.env.production automáticamente en modo prod
        # y resuelve VITE_API_BASE -> https://api.villanuevarodrigo.com/index.php.
        run: npm run build

      # ---------------------------------------------------------------
      # Backend: dependencias PHP con Composer.
      # ---------------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Instalar dependencias del backend (composer)
        # backend/vendor/ está en .gitignore, lo regeneramos en CI.
        # --no-dev evita subir librerías de testing al servidor.
        working-directory: backend
        run: composer install --no-dev --no-interaction --optimize-autoloader --prefer-dist

      # ---------------------------------------------------------------
      # Deploy del frontend -> villanuevarodrigo.com (raíz).
      # IONOS Hosting Plus solo expone SFTP (puerto 22). Por eso usamos
      # wlixcc/SFTP-Deploy-Action en lugar de la action estándar de FTPS:
      # IONOS discontinuó el FTP/FTPS por seguridad y la conexión a 21
      # da timeout. Documentado como decisión en ADR-09.
      # ---------------------------------------------------------------
      - name: Deploy frontend
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          server: ${{ secrets.SFTP_HOST }}
          port: 22
          # El glob /* sube el CONTENIDO de dist/ al destino, no la
          # carpeta dist/ en sí. Sin el /* acabaríamos con
          # /villanuevarodrigo.com/dist/index.html, que no es lo que queremos.
          local_path: './frontend/dist/*'
          # IONOS no permite puntos en los nombres de carpeta del hosting,
          # por eso las carpetas reales son `villanuevarodrigocom` y
          # `APIvillanuevarodrigo` aunque los DOMINIOS sí los lleven
          # (villanuevarodrigo.com y api.villanuevarodrigo.com).
          remote_path: '/villanuevarodrigocom/'
          sftp_only: true

      # ---------------------------------------------------------------
      # Preparar carpeta limpia para el backend.
      # wlixcc/SFTP-Deploy-Action no soporta `exclude` directamente, así
      # que copiamos backend/ a una carpeta temporal con rsync y
      # eliminamos lo que no debe ir a producción ANTES del SFTP.
      # ---------------------------------------------------------------
      - name: Preparar backend para deploy (excludes vía rsync)
        run: |
          mkdir -p backend-deploy
          rsync -av \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='uploads/avatars/' \
            --exclude='uploads/notes/' \
            --exclude='tests/' \
            --exclude='.vscode/' \
            --exclude='.idea/' \
            --exclude='.DS_Store' \
            backend/ backend-deploy/

      # ---------------------------------------------------------------
      # Deploy del backend -> api.villanuevarodrigo.com (raíz contenedora).
      # IONOS expone solo /public/ vía Apache; el resto queda fuera del
      # alcance HTTP pero los archivos sí están subidos para que el
      # bootstrap PHP (require_once __DIR__ . '/../...') funcione.
      # ---------------------------------------------------------------
      - name: Deploy backend
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          server: ${{ secrets.SFTP_HOST }}
          port: 22
          local_path: './backend-deploy/*'
          # Misma razón que el frontend: IONOS sin puntos en carpetas.
          remote_path: '/APIvillanuevarodrigo/'
          sftp_only: true

      - name: Resumen
        if: always()
        run: |
          echo "Deploy completado."
          echo "Frontend: https://villanuevarodrigo.com"
          echo "Backend:  https://api.villanuevarodrigo.com"
