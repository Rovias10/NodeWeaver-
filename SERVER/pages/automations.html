<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NodeWeaver - Mis Automatizaciones</title>
    <meta name="description" content="Gestiona tus flujos de automatización en NodeWeaver." />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/tailwind.css" />
    <style>
      /* ── Custom Scrollbar ── */
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

      /* ── Cards Grid ── */
      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
      }

      .auto-card {
        background: rgba(30,41,59,0.45);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 1.25rem;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        transition: transform 0.25s cubic-bezier(.4,0,.2,1), border-color 0.25s, box-shadow 0.25s;
        animation: cardIn 0.4s cubic-bezier(.4,0,.2,1) both;
      }
      .auto-card:hover {
        transform: translateY(-4px);
        border-color: rgba(236,72,153,0.3);
        box-shadow: 0 16px 48px rgba(0,0,0,0.4);
      }
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .card-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.25rem 0.7rem;
        border-radius: 999px;
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .badge-active  { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
      .badge-inactive { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.15); }
      .badge-dot { width: 6px; height: 6px; border-radius: 50%; }
      .badge-active .badge-dot  { background: #34d399; box-shadow: 0 0 6px rgba(52,211,153,0.7); }
      .badge-inactive .badge-dot { background: #f87171; box-shadow: 0 0 6px rgba(248,113,113,0.5); }

      /* n8n bridge badges (Fase 7) */
      .badge-synced   { background: rgba(52,211,153,0.1);  color: #6ee7b7; border: 1px solid rgba(52,211,153,0.25); }
      .badge-unsynced { background: rgba(148,163,184,0.1); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.2); }
      .badge-sync-error { background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.25); }
      .badge-syncing  { background: rgba(245,158,11,0.12); color: #fcd34d; border: 1px solid rgba(245,158,11,0.25); }

      .btn-edit { background: rgba(6,182,212,0.1); color: #67e8f9; }
      .btn-edit:hover { background: rgba(6,182,212,0.25); border-color: rgba(6,182,212,0.3); }
      .btn-delete { background: rgba(239,68,68,0.08); color: #f87171; }
      .btn-delete:hover { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.25); }

      /* Loading skeleton */
      .skeleton-card {
        background: rgba(30,41,59,0.3);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 1.25rem;
        height: 160px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }

      /* Modal */
      .modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
        display: flex; align-items: center; justify-content: center; z-index: 200;
        animation: fadeIn 0.2s ease;
      }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </head>
  <body class="bg-slate-900 text-white h-screen overflow-hidden font-sans antialiased text-sm relative">
    
    <!-- Warm Ambient Background Glows -->
    <div class="absolute top-[-15%] left-[-10%] w-[50%] h-[50%] rounded-full bg-amber-500/10 blur-[140px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-pink-600/15 blur-[120px] pointer-events-none"></div>
    <div class="absolute top-[20%] right-[30%] w-[30%] h-[30%] rounded-full bg-cyan-500/10 blur-[130px] pointer-events-none"></div>

    <!-- Floating App Layout -->
    <div id="app" class="h-full p-4 lg:p-5 flex flex-row gap-4 relative z-10 box-border w-full">
      
      <!-- Premium Sidebar Left (Matched with Dashboard) -->
      <div id="sidebar-left" class="w-64 bg-slate-800/40 backdrop-blur-2xl border border-white/10 rounded-3xl flex flex-col flex-shrink-0 shadow-2xl shadow-black/40 overflow-hidden">
        
        <!-- Logo Header -->
        <div class="px-5 py-5 border-b border-white/5 flex items-center justify-between bg-white/5">
          <div class="flex items-center gap-3 font-extrabold text-lg tracking-wide">
            <object type="image/svg+xml" data="../assets/nodeweaver-logo.svg" class="w-7 h-7 drop-shadow-[0_0_8px_rgba(236,72,153,0.4)] pointer-events-none"></object>
            <span>NodeWeaver</span>
          </div>
        </div>

        <div class="px-3 py-4 space-y-1 border-b border-white/5">
          <a href="automations.html" class="flex items-center gap-3 p-2.5 rounded-xl bg-white/5 border border-white/10 text-white font-bold text-xs transition-all shadow-sm">
            <i class="fas fa-list-ul text-pink-400 w-4 text-center"></i> Mis Automatizaciones
          </a>
        </div>

        <div class="flex-1 overflow-y-auto custom-scrollbar p-3">
          <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-2 mb-3">Gestión de Cuenta</div>
          <a href="profile.html" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-white/5 text-slate-400 hover:text-white transition-all font-medium">
             <i class="fas fa-user-circle w-4 text-center"></i> Mi Perfil
          </a>
        </div>

        <!-- User Footer -->
        <div class="p-4 border-t border-white/5 flex items-center justify-between bg-black/10">
          <div class="flex items-center gap-3">
            <div id="dash-avatar" class="w-9 h-9 rounded-full bg-gradient-to-tr from-cyan-400 to-blue-600 flex items-center justify-center font-bold text-white text-xs border-2 border-slate-800 shadow-md">
              <span id="dash-initials">NW</span>
            </div>
            <div class="flex flex-col">
              <span id="dash-username" class="font-bold text-xs text-slate-200">Usuario</span>
              <span id="dash-role" class="text-[10px] text-emerald-400">Free Plan</span>
            </div>
          </div>
          <button onclick="logout()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-500/20 text-slate-400 hover:text-red-400 transition-colors">
            <i class="fas fa-sign-out-alt text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Main Content Area -->
      <div class="flex-1 flex flex-col gap-4 min-w-0">
        
        <!-- Header -->
        <div class="h-16 bg-slate-800/40 backdrop-blur-2xl border border-white/10 rounded-3xl flex items-center justify-between px-6 z-10 shadow-2xl shadow-black/30">
          <h1 class="text-lg font-bold flex items-center gap-3">
            <i class="fas fa-robot text-pink-500"></i>
            Mis Automatizaciones
          </h1>
          <button onclick="window.location.href='dashboard.html'" class="px-4 py-2 text-xs font-bold rounded-xl bg-gradient-to-r from-amber-500 to-pink-500 hover:shadow-lg hover:shadow-pink-500/40 text-white transition-all transform hover:-translate-y-0.5 flex items-center gap-2">
            <i class="fas fa-plus"></i> Nueva
          </button>
        </div>

        <!-- Stats + Grid -->
        <div class="flex-1 overflow-y-auto custom-scrollbar pr-1 flex flex-col gap-4">
          <!-- Hero stats (Fase 7) -->
          <div class="bg-slate-800/40 backdrop-blur-2xl border border-white/10 rounded-3xl p-5 shadow-2xl shadow-black/30">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-sm font-bold text-slate-200 flex items-center gap-2">
                <i class="fas fa-chart-line text-cyan-400"></i> Resumen de ejecuciones
              </h2>
              <button id="btn-refresh-stats" class="text-[10px] text-slate-400 hover:text-white px-2 py-1 rounded-lg hover:bg-white/5 transition">
                <i class="fas fa-rotate"></i> Refrescar
              </button>
            </div>
            <div id="stats-hero"></div>
          </div>

          <div class="cards-grid" id="automations-grid">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Delete Modal -->
    <div id="delete-modal" class="modal-overlay" style="display:none;">
      <div class="bg-slate-800/95 border border-white/10 rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
        <i class="fas fa-exclamation-triangle text-3xl text-red-500 mb-4"></i>
        <h3 class="text-lg font-bold mb-2">¿Eliminar automatización?</h3>
        <p id="delete-modal-name" class="text-slate-400 text-xs mb-6">Esta acción no se puede deshacer.</p>
        <div class="flex gap-3 justify-center">
          <button onclick="closeDeleteModal()" class="px-6 py-2 rounded-xl bg-slate-700 text-slate-300 font-bold hover:bg-slate-600 transition-all">Cancelar</button>
          <button id="btn-confirm-delete" class="px-6 py-2 rounded-xl bg-red-500/20 text-red-400 border border-red-500/30 font-bold hover:bg-red-500 hover:text-white transition-all">Eliminar</button>
        </div>
      </div>
    </div>

    <script src="../js/stats.js"></script>
    <script>
      const token = localStorage.getItem('token');
      if (!token) window.location.href = 'auth/login.html';

      const API_BASE = '../../API/index.php?route=';
      const grid = document.getElementById('automations-grid');
      let pendingDeleteId = null;
      const nwStats = new NodeWeaverStats(API_BASE);

      async function loadUser() {
          try {
            const res = await fetch(API_BASE + 'profile/me', { headers: { 'Authorization': 'Bearer ' + token } });
            const data = await res.json();
            if (data.success) {
                const u = data.user;
                document.getElementById('dash-initials').textContent = (u.name || 'NW').substring(0,2).toUpperCase();
                document.getElementById('dash-username').textContent = u.name || 'Usuario';
                document.getElementById('dash-role').textContent = (u.role || 'free').toUpperCase() + ' Plan';
            }
          } catch(e) {}
      }

      async function loadAutomations() {
        try {
          const res = await fetch(API_BASE + 'automation/list', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();

          if (!data.success) {
            grid.innerHTML = renderEmpty('Error al cargar datos del servidor.');
            return;
          }

          if (!data.automations || data.automations.length === 0) {
            grid.classList.remove('cards-grid');
            grid.classList.add('flex', 'flex-col', 'items-center', 'justify-center');
            grid.innerHTML = renderEmpty('Aún no tienes automatizaciones guardadas.');
            return;
          }

          grid.innerHTML = data.automations.map((a, i) => renderCard(a, i)).join('');
        } catch (err) {
          grid.innerHTML = renderEmpty('No se pudo conectar con el servicio de API.');
        }
      }

      function renderCard(a, index) {
        const isActive = Number(a.is_active) === 1;
        const date = a.created_at ? new Date(a.created_at).toLocaleDateString('es-ES') : 'Fecha desconocida';
        const badgeClass = isActive ? 'badge-active' : 'badge-inactive';
        const badgeLabel = isActive ? 'Activo' : 'Inactivo';

        // n8n bridge badge
        const syncStatus = a.n8n_sync_status || 'unsynced';
        const syncConfig = {
          synced:    { cls: 'badge-synced',     icon: 'fa-check',                lbl: 'Sync' },
          unsynced:  { cls: 'badge-unsynced',   icon: 'fa-circle-dashed',        lbl: 'Sin sync' },
          syncing:   { cls: 'badge-syncing',    icon: 'fa-spinner fa-spin',      lbl: 'Sincronizando' },
          error:     { cls: 'badge-sync-error', icon: 'fa-triangle-exclamation', lbl: 'Error n8n' },
        }[syncStatus] || { cls: 'badge-unsynced', icon: 'fa-circle-dashed', lbl: 'Sin sync' };
        const syncTooltip = a.n8n_sync_error ? ` title="${a.n8n_sync_error.replace(/"/g, '&quot;')}"` : '';
        const lastSync = a.n8n_last_sync_at
          ? new Date(a.n8n_last_sync_at).toLocaleString('es-ES', {hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})
          : null;

        // Run stats (Fase 7)
        const runs   = Number(a.total_runs   || 0);
        const errors = Number(a.total_errors || 0);
        const lastRun = a.last_run_at
          ? new Date(a.last_run_at).toLocaleString('es-ES', {hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})
          : null;

        return `
          <div class="auto-card" style="animation-delay:${index * 0.05}s" id="card-${a.id}">
            <div class="flex items-center justify-between gap-2">
              <span class="font-bold text-slate-100 truncate pr-2">${a.name}</span>
              <span class="card-badge ${badgeClass}">
                <span class="badge-dot"></span> ${badgeLabel}
              </span>
            </div>
            <div class="flex items-center gap-2">
              <span class="card-badge ${syncConfig.cls}"${syncTooltip}>
                <i class="fas ${syncConfig.icon}"></i> ${syncConfig.lbl}
              </span>
              ${lastSync ? `<span class="text-[9px] text-slate-500">sync: ${lastSync}</span>` : ''}
            </div>
            <div class="flex items-center gap-3 text-[10px] text-slate-500 border-t border-white/5 pt-2">
              <span><i class="fas fa-bolt text-amber-400/80"></i> <span class="text-slate-300 font-bold">${runs}</span> runs</span>
              <span><i class="fas fa-circle-exclamation text-red-400/80"></i> <span class="text-slate-300 font-bold">${errors}</span> err</span>
              ${lastRun ? `<span class="ml-auto"><i class="fas fa-clock opacity-60"></i> ${lastRun}</span>` : `<span class="ml-auto opacity-60">sin ejec.</span>`}
            </div>
            <div class="text-[10px] text-slate-500 flex items-center gap-1.5">
              <i class="fas fa-calendar-plus opacity-60"></i> Creado el ${date}
            </div>
            <div class="flex gap-2 mt-2">
              <button class="btn-edit flex-1 flex items-center justify-center gap-2 py-2 rounded-xl text-[11px] font-bold transition-all border border-transparent" onclick="window.location.href='dashboard.html?id=${a.id}'">
                <i class="fas fa-pen-to-square"></i> Editar
              </button>
              <button class="btn-delete flex-1 flex items-center justify-center gap-2 py-2 rounded-xl text-[11px] font-bold transition-all border border-transparent" onclick="confirmDelete(${a.id}, '${a.name.replace(/'/g, "\\'")}')">
                <i class="fas fa-trash-can"></i> Borrar
              </button>
            </div>
          </div>`;
      }

      function renderEmpty(msg) {
        return `<div class="flex flex-col items-center justify-center text-center opacity-80 animate-in fade-in duration-500 py-12">
          <div class="w-24 h-24 rounded-full bg-slate-800/40 border border-white/10 flex items-center justify-center mb-6 shadow-2xl">
            <i class="fas fa-folder-open text-4xl text-slate-600"></i>
          </div>
          <h3 class="text-xl font-bold text-slate-200 mb-2">No hay nada por aquí</h3>
          <p class="text-sm font-medium text-slate-400 max-w-sm mb-8">${msg}</p>
          <button onclick="window.location.href='dashboard.html'" class="px-6 py-3 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 hover:shadow-lg hover:shadow-pink-500/40 text-white font-bold text-xs transition-all flex items-center gap-2 transform hover:-translate-y-0.5">
            <i class="fas fa-plus"></i> Crear mi primer flujo
          </button>
        </div>`;
      }

      function confirmDelete(id, name) {
        pendingDeleteId = id;
        document.getElementById('delete-modal-name').textContent = `Se borrará "${name}" permanentemente.`;
        document.getElementById('delete-modal').style.display = 'flex';
      }

      function closeDeleteModal() {
        pendingDeleteId = null;
        document.getElementById('delete-modal').style.display = 'none';
      }

      document.getElementById('btn-confirm-delete').addEventListener('click', async () => {
        if (!pendingDeleteId) return;
        try {
          const res = await fetch(API_BASE + 'automation/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ id: pendingDeleteId })
          });
          const data = await res.json();
          if (data.success) {
            const card = document.getElementById('card-' + pendingDeleteId);
            if (card) { card.style.opacity = '0'; setTimeout(() => { card.remove(); if(grid.children.length === 0) grid.innerHTML = renderEmpty('No quedan automatizaciones.'); }, 300); }
          }
        } catch (err) {}
        closeDeleteModal();
      });

      function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'auth/login.html';
      }

      document.getElementById('btn-refresh-stats')?.addEventListener('click', () => {
        nwStats.renderInto('#stats-hero');
        loadAutomations();
      });

      // Init
      loadUser();
      loadAutomations();
      nwStats.renderInto('#stats-hero');
    </script>
  </body>
</html>
