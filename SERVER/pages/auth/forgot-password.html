<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña - NodeWeaver</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="../../css/tailwind.css" />
    <style>
      @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    </style>
  </head>
  <body class="bg-[#0e1015] text-white min-h-screen font-sans antialiased flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Decorators -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/20 blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] rounded-full bg-primary-dark/20 blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-md p-8 md:p-10 bg-[#151821]/80 backdrop-blur-xl border border-white/10 rounded-3xl shadow-2xl z-10 transition-all duration-300">
      <div class="text-center mb-8">
        <i class="fas fa-bolt text-4xl text-primary drop-shadow-[0_0_15px_rgba(230,194,0,0.5)] mb-4"></i>
        <h2 class="text-2xl font-bold text-white mb-2">Recuperar contraseña</h2>
        <p class="text-gray-400 text-sm">Te enviaremos instrucciones a tu email</p>
      </div>

      <div id="successMessage" class="hidden items-center justify-center gap-2 p-4 mb-6 rounded-lg bg-green-500/10 border border-green-500/50 text-green-400 text-sm font-medium animate-[slideIn_0.3s_ease-out_forwards]">
        <i class="fas fa-check-circle text-lg"></i>
        <span>Si el email existe, recibirás instrucciones</span>
      </div>

      <form id="forgotForm" class="flex flex-col gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Email registrado</label>
          <div class="relative">
            <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
            <input type="email" id="email" class="w-full bg-gray-900/50 border border-white/10 rounded-lg pl-11 pr-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="tu@email.com" required />
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full mt-2 bg-primary hover:bg-primary-light text-[#0e1015] font-bold py-3.5 rounded-lg flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(230,194,0,0.3)] hover:shadow-[0_0_20px_rgba(230,194,0,0.5)] transition-all hover:-translate-y-0.5">
          <i class="fas fa-paper-plane"></i> Enviar instrucciones
        </button>
      </form>

      <div class="mt-8 text-center text-sm">
        <a href="login.html" class="flex items-center justify-center gap-2 text-gray-400 hover:text-white transition-colors group">
          <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i> Volver al inicio de sesión
        </a>
      </div>
    </div>

    <!-- Notification Engine -->
    <div id="notification-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3"></div>

    <script>
      document.getElementById("forgotForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value;
          const btn = document.getElementById("submitBtn");

          btn.disabled = true;
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
          showNotification("Enviando instrucciones...", "info");

          try {
            const response = await fetch("../../../API/index.php?route=auth/forgot-password", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email }),
            });
            const data = await response.json();

            if (data.success) {
              document.getElementById("successMessage").classList.remove("hidden");
              document.getElementById("successMessage").classList.add("flex");
              document.getElementById("forgotForm").classList.add("hidden");
            } else {
              showNotification(data.message, "error");
              btn.disabled = false;
              btn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar instrucciones';
            }
          } catch (error) {
            showNotification("Error de conexión", "error");
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar instrucciones';
          }
      });

      function showNotification(message, type = "info") {
        const container = document.getElementById("notification-container");
        const notif = document.createElement("div");
        let bg = type === "success" ? "bg-green-500/10 border-green-500/50 text-green-400" : type === "error" ? "bg-red-500/10 border-red-500/50 text-red-400" : "bg-blue-500/10 border-blue-500/50 text-blue-400";
        let icon = type === "success" ? "fa-check-circle" : type === "error" ? "fa-exclamation-circle" : "fa-info-circle";
        notif.className = `flex items-center gap-3 px-5 py-4 rounded-lg border backdrop-blur-md shadow-lg min-w-[300px] ${bg} animate-[slideIn_0.3s_ease-out_forwards]`;
        notif.innerHTML = `<i class="fas ${icon} text-xl"></i><span class="font-medium text-sm text-white">${message}</span>`;
        container.appendChild(notif);
        setTimeout(() => { notif.style.animation = "slideOut 0.3s ease-in forwards"; setTimeout(() => notif.remove(), 300); }, 3000);
      }
    </script>
  </body>
</html>
