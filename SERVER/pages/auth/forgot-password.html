<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña - NodeWeaver</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="../../css/tailwind.css" />
    <style>
      @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
      .grid-pattern {
        background-image:
          linear-gradient(rgba(139, 92, 246, 0.1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(139, 92, 246, 0.1) 1px, transparent 1px);
        background-size: 80px 80px;
      }
    </style>
  </head>
  <body class="bg-[#0a0a0f] text-white min-h-screen font-sans antialiased flex items-center justify-center p-4 relative overflow-hidden isolate">
    
    <!-- Seamless Flowing Background Elements -->
    <div class="fixed inset-0 bg-[#0a0a0f] z-[-10] pointer-events-none"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-purple-900/20 via-pink-900/10 to-[#0a0a0f] z-[-9] pointer-events-none"></div>
    <div class="fixed inset-0 grid-pattern opacity-25 z-[-8] pointer-events-none"></div>

    <!-- Warm Ambient Background Glows -->
    <div class="absolute top-[-15%] left-[-10%] w-[50%] h-[50%] rounded-full bg-amber-500/10 blur-[140px] pointer-events-none z-[-7]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-pink-600/15 blur-[120px] pointer-events-none z-[-7]"></div>

    <div class="w-full max-w-md p-8 md:p-10 bg-slate-800/40 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-2xl shadow-black/40 z-10">
      <div class="text-center mb-8">
        <object type="image/svg+xml" data="../../assets/nodeweaver-logo.svg" class="w-16 h-16 mx-auto mb-4 drop-shadow-[0_0_15px_rgba(236,72,153,0.4)] pointer-events-none"></object>
        <h2 class="text-2xl font-bold text-white mb-2">Recuperar Acceso</h2>
        <p class="text-slate-400 text-sm">Te enviaremos un enlace para restablecer tu contraseña</p>
      </div>

      <div id="successContainer" class="hidden items-center justify-center flex-col gap-4 p-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-center animate-[slideIn_0.3s_ease-out_forwards]">
        <i class="fas fa-paper-plane text-5xl mb-2 drop-shadow-[0_0_15px_rgba(16,185,129,0.5)]"></i>
        <span class="text-lg font-bold">¡Enviado con éxito!</span>
        <p class="text-sm text-emerald-200/70">Si el correo existe, recibirás las instrucciones en unos minutos.</p>
        <a href="login.html" class="mt-4 text-emerald-400 hover:text-white font-bold text-sm flex items-center gap-2 transition-colors">
          <i class="fas fa-arrow-left"></i> Volver al Login
        </a>
      </div>

      <form id="forgotForm" class="flex flex-col gap-6">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Correo Electrónico</label>
          <div class="relative">
            <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input type="email" id="email" class="w-full bg-slate-900/50 border border-white/10 rounded-xl pl-11 pr-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-pink-500/50 transition-all shadow-inner" placeholder="tu@email.com" required />
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full mt-2 bg-gradient-to-r from-purple-600 via-pink-600 to-cyan-600 hover:shadow-lg hover:shadow-purple-500/50 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all transform hover:-translate-y-0.5">
          <i class="fas fa-magic"></i> Enviar instrucciones
        </button>
      </form>

      <div class="mt-8 text-center text-sm">
        <a href="login.html" class="flex items-center justify-center gap-2 text-slate-400 hover:text-white transition-colors group">
          <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i> Volver al inicio de sesión
        </a>
      </div>
    </div>

    <!-- Notification Engine -->
    <div id="notification-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3"></div>

    <script>
      document.getElementById("forgotForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value;
          const btn = document.getElementById("submitBtn");

          btn.disabled = true;
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

          try {
            const response = await fetch("../../../API/index.php?route=auth/forgot-password", {
                method: "POST", 
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email }),
            });
            const data = await response.json();

            if (data.success) {
              document.getElementById("successContainer").classList.remove("hidden");
              document.getElementById("successContainer").classList.add("flex");
              document.getElementById("forgotForm").classList.add("hidden");
            } else {
              showNotification(data.message, "error");
              btn.disabled = false;
              btn.innerHTML = '<i class="fas fa-magic"></i> Enviar instrucciones';
            }
          } catch (error) {
            showNotification("Error de conexión", "error");
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-magic"></i> Enviar instrucciones';
          }
      });

      function showNotification(message, type = "info") {
        const container = document.getElementById("notification-container");
        const notif = document.createElement("div");
        let bg = type === "success" ? "bg-emerald-500/10 border-emerald-500/50 text-emerald-400" : type === "error" ? "bg-red-500/10 border-red-500/50 text-red-400" : "bg-cyan-500/10 border-cyan-500/50 text-cyan-400";
        let icon = type === "success" ? "fa-check-circle" : type === "error" ? "fa-exclamation-circle" : "fa-info-circle";
        notif.className = `flex items-center gap-3 px-5 py-4 rounded-xl border backdrop-blur-md shadow-lg min-w-[300px] ${bg} animate-[slideIn_0.3s_ease-out_forwards]`;
        notif.innerHTML = `<i class="fas ${icon} text-xl"></i><span class="font-medium text-sm text-white">${message}</span>`;
        container.appendChild(notif);
        setTimeout(() => { notif.style.animation = "slideOut 0.3s ease-in forwards"; setTimeout(() => notif.remove(), 300); }, 3000);
      }
    </script>
  </body>
</html>
