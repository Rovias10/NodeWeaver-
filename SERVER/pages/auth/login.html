<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - NodeWeaver</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="../../css/tailwind.css" />
    <style>
      /* Fallback alert animations */
      @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    </style>
  </head>
  <body class="bg-[#0e1015] text-white min-h-screen font-sans antialiased flex items-center justify-center relative overflow-hidden">
    
    <!-- Background Decorators -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/20 blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] rounded-full bg-primary-dark/20 blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-md p-8 md:p-10 mx-4 bg-[#151821]/80 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl z-10">
      <div class="text-center mb-8">
        <i class="fas fa-bolt text-4xl text-primary drop-shadow-[0_0_15px_rgba(230,194,0,0.5)] mb-4"></i>
        <h2 class="text-2xl font-bold text-white mb-2">Bienvenido de nuevo</h2>
        <p class="text-gray-400 text-sm">Inicia sesión en tu cuenta de NodeWeaver</p>
      </div>

      <form id="loginForm" class="flex flex-col gap-5">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Email</label>
          <input
            type="email"
            id="email"
            class="w-full bg-gray-900/50 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all"
            placeholder="tu@email.com"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Contraseña</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              class="w-full bg-gray-900/50 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all"
              placeholder="••••••••"
              required
            />
            <i class="fas fa-eye absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer hover:text-white transition-colors" onclick="togglePassword(event)"></i>
          </div>
        </div>

        <div class="text-right -mt-2">
          <a href="forgot-password.html" class="text-sm text-primary hover:text-primary-light transition-colors">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="w-full mt-2 bg-primary hover:bg-primary-light text-[#0e1015] font-bold py-3.5 rounded-lg flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(230,194,0,0.3)] hover:shadow-[0_0_20px_rgba(230,194,0,0.5)] transition-all hover:-translate-y-0.5">
          <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
        </button>

        <div class="relative flex items-center py-2">
          <div class="flex-grow border-t border-white/10"></div>
          <span class="flex-shrink-0 mx-4 text-gray-500 text-sm">o</span>
          <div class="flex-grow border-t border-white/10"></div>
        </div>

        <button type="button" onclick="loginWithGoogle()" class="w-full bg-white/5 hover:bg-white/10 border border-white/10 text-white font-medium py-3 rounded-lg flex items-center justify-center gap-2 transition-all">
          <i class="fab fa-google text-lg"></i> Continuar con Google
        </button>
      </form>

      <div class="mt-8 text-center text-sm text-gray-400">
        ¿No tienes una cuenta? <a href="register.html" class="text-primary hover:text-primary-light font-semibold ml-1">Regístrate gratis</a>
      </div>
    </div>

    <!-- Container Notificaciones (Absolute Positioned manually by js) -->
    <div id="notification-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3"></div>

    <script>
      function togglePassword(event) {
        const password = document.getElementById("password");
        const icon = event.target;
        if (password.type === "password") {
          password.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          password.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          showNotification("Iniciando sesión...", "info");

          try {
            const response = await fetch("../../../API/index.php?route=auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password }),
            });

            const data = await response.json();

            if (data.success) {
              localStorage.setItem("token", data.token);
              localStorage.setItem("user", JSON.stringify(data.user));
              showNotification("¡Login correcto! Redirigiendo...", "success");
              setTimeout(() => window.location.href = "../dashboard.html", 1500);
            } else {
              showNotification(data.message, "error");
            }
          } catch (error) {
            console.error(error);
            showNotification("Error de conexión: " + error.message, "error");
          }
      });

      function loginWithGoogle() {
        const GOOGLE_CLIENT_ID = "558764914281-cklberlvgkjd04d9fhmo2umuq9eudp4j.apps.googleusercontent.com";
        const redirectUri = encodeURIComponent("http://localhost/backend/auth/google-oauth.php");
        // Update URL properly if needed later.
        window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CLIENT_ID}&redirect_uri=${redirectUri}&response_type=token&scope=email%20profile%20openid`;
      }

      function showNotification(message, type = "info") {
        const container = document.getElementById("notification-container");
        const notif = document.createElement("div");
        
        let bg = type === "success" ? "bg-green-500/10 border-green-500/50 text-green-400" : 
                 type === "error" ? "bg-red-500/10 border-red-500/50 text-red-400" : 
                 "bg-blue-500/10 border-blue-500/50 text-blue-400";
        let icon = type === "success" ? "fa-check-circle" : type === "error" ? "fa-exclamation-circle" : "fa-info-circle";

        notif.className = `flex items-center gap-3 px-5 py-4 rounded-lg border backdrop-blur-md shadow-lg min-w-[300px] ${bg} animate-[slideIn_0.3s_ease-out_forwards]`;
        notif.innerHTML = `<i class="fas ${icon} text-xl"></i><span class="font-medium text-sm text-white">${message}</span>`;
        
        container.appendChild(notif);
        setTimeout(() => {
          notif.style.animation = "slideOut 0.3s ease-in forwards";
          setTimeout(() => notif.remove(), 300);
        }, 3000);
      }
    </script>
  </body>
</html>
