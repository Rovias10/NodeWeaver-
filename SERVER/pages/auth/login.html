<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - NodeWeaver</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="../../css/tailwind.css" />
    <style>
      /* Fallback alert animations */
      @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
      .grid-pattern {
        background-image:
          linear-gradient(rgba(139, 92, 246, 0.1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(139, 92, 246, 0.1) 1px, transparent 1px);
        background-size: 80px 80px;
      }
    </style>
  </head>
  <body class="bg-[#0a0a0f] text-white min-h-screen font-sans antialiased flex items-center justify-center relative overflow-hidden isolate">
    
    <!-- Seamless Flowing Background Elements - GLOBAL PARA TODO EL SITIO -->
    <div class="fixed inset-0 bg-[#0a0a0f] z-[-10] pointer-events-none"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-purple-900/20 via-pink-900/10 to-[#0a0a0f] z-[-9] pointer-events-none"></div>
    <div class="fixed inset-0 grid-pattern opacity-25 z-[-8] pointer-events-none"></div>

    <!-- Warm Ambient Background Glows -->
    <div class="absolute top-[-15%] left-[-10%] w-[50%] h-[50%] rounded-full bg-amber-500/10 blur-[140px] pointer-events-none z-[-7]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-pink-600/15 blur-[120px] pointer-events-none z-[-7]"></div>
    <div class="absolute top-[20%] right-[30%] w-[30%] h-[30%] rounded-full bg-cyan-500/10 blur-[130px] pointer-events-none z-[-7]"></div>

    <div class="w-full max-w-md p-8 md:p-10 mx-4 bg-slate-800/40 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-2xl shadow-black/40 z-10">
      <div class="text-center mb-8">
        <object type="image/svg+xml" data="../../assets/nodeweaver-logo.svg" class="w-16 h-16 mx-auto mb-4 drop-shadow-[0_0_15px_rgba(236,72,153,0.4)] pointer-events-none"></object>
        <h2 class="text-2xl font-bold text-white mb-2">Bienvenido de nuevo</h2>
        <p class="text-slate-400 text-sm">Inicia sesión en tu cuenta de NodeWeaver</p>
      </div>

      <form id="loginForm" class="flex flex-col gap-5">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Email</label>
          <input
            type="email"
            id="email"
            class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500/50 transition-all shadow-inner"
            placeholder="tu@email.com"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Contraseña</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500/50 transition-all shadow-inner"
              placeholder="••••••••"
              required
            />
            <i class="fas fa-eye absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer hover:text-white transition-colors" onclick="togglePassword(event)"></i>
          </div>
        </div>

        <div class="text-right -mt-2">
          <a href="forgot-password.html" class="text-sm text-pink-400 hover:text-pink-300 transition-colors">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="w-full mt-2 bg-gradient-to-r from-purple-600 via-pink-600 to-cyan-600 hover:shadow-lg hover:shadow-purple-500/50 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all transform hover:-translate-y-0.5">
          <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
        </button>

        <div class="relative flex items-center py-2">
          <div class="flex-grow border-t border-white/10"></div>
          <span class="flex-shrink-0 mx-4 text-slate-500 text-sm">o</span>
          <div class="flex-grow border-t border-white/10"></div>
        </div>

        <button type="button" onclick="loginWithGoogle()" class="w-full bg-white/5 hover:bg-white/10 border border-white/10 text-white font-medium py-3 rounded-xl flex items-center justify-center gap-2 transition-all">
          <i class="fab fa-google text-lg"></i> Continuar con Google
        </button>
      </form>

      <div class="mt-8 text-center text-sm text-slate-400">
        ¿No tienes una cuenta? <a href="register.html" class="bg-gradient-to-r from-purple-400 to-cyan-400 bg-clip-text text-transparent hover:from-purple-300 hover:to-cyan-300 font-bold ml-1 transition-all">Regístrate gratis</a>
      </div>
    </div>

    <!-- Container Notificaciones (Absolute Positioned manually by js) -->
    <div id="notification-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3"></div>

    <script>
      function togglePassword(event) {
        const password = document.getElementById("password");
        const icon = event.target;
        if (password.type === "password") {
          password.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          password.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          showNotification("Iniciando sesión...", "info");

          try {
            const response = await fetch("../../../API/index.php?route=auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password }),
            });

            const data = await response.json();

            if (data.success) {
              localStorage.setItem("token", data.token);
              localStorage.setItem("user", JSON.stringify(data.user));
              showNotification("¡Login correcto! Redirigiendo...", "success");
              setTimeout(() => window.location.href = "../dashboard.html", 1500);
            } else {
              showNotification(data.message, "error");
            }
          } catch (error) {
            console.error(error);
            showNotification("Error de conexión: " + error.message, "error");
          }
      });

      function loginWithGoogle() {
        const GOOGLE_CLIENT_ID = "558764914281-cklberlvgkjd04d9fhmo2umuq9eudp4j.apps.googleusercontent.com";
        const redirectUri = encodeURIComponent("http://localhost/backend/auth/google-oauth.php");
        // Update URL properly if needed later.
        window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CLIENT_ID}&redirect_uri=${redirectUri}&response_type=token&scope=email%20profile%20openid`;
      }

      function showNotification(message, type = "info") {
        const container = document.getElementById("notification-container");
        const notif = document.createElement("div");
        
        let bg = type === "success" ? "bg-emerald-500/10 border-emerald-500/50 text-emerald-400" : 
                 type === "error" ? "bg-red-500/10 border-red-500/50 text-red-400" : 
                 "bg-cyan-500/10 border-cyan-500/50 text-cyan-400";
        let icon = type === "success" ? "fa-check-circle" : type === "error" ? "fa-exclamation-circle" : "fa-info-circle";

        notif.className = `flex items-center gap-3 px-5 py-4 rounded-xl border backdrop-blur-md shadow-lg min-w-[300px] ${bg} animate-[slideIn_0.3s_ease-out_forwards]`;
        notif.innerHTML = `<i class="fas ${icon} text-xl"></i><span class="font-medium text-sm text-white">${message}</span>`;
        
        container.appendChild(notif);
        setTimeout(() => {
          notif.style.animation = "slideOut 0.3s ease-in forwards";
          setTimeout(() => notif.remove(), 300);
        }, 3000);
      }
    </script>
  </body>
</html>
