<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - NodeWeaver</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/theme.css?v=15" />
    <link rel="stylesheet" href="../../css/auth.css?v=15" />
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-header">
        <i class="fas fa-bolt auth-logo"></i>
        <h2>Bienvenido de nuevo</h2>
        <p>Inicia sesión en tu cuenta de NodeWeaver</p>
      </div>

      <form id="loginForm">
        <div class="mb-4">
          <label class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="tu@email.com"
            required
          />
        </div>

        <div class="mb-4">
          <label class="form-label">Contraseña</label>
          <div class="position-relative">
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="••••••••"
              required
            />
            <i
              class="fas fa-eye password-toggle"
              onclick="togglePassword()"
            ></i>
          </div>
        </div>

        <div class="mb-4 text-end">
          <a
            href="forgot-password.html"
            class="text-decoration-none"
            style="color: var(--accent-color)"
          >
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <button type="submit" class="btn-auth mb-3">
          <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
        </button>

        <div class="divider">
          <span>o</span>
        </div>

        <button type="button" class="btn-google" onclick="loginWithGoogle()">
          <i class="fab fa-google"></i>
          Continuar con Google
        </button>
      </form>

      <div class="auth-footer">
        ¿No tienes una cuenta? <a href="register.html">Regístrate gratis</a>
      </div>
    </div>

    <div id="notification-container" class="notification-container"></div>

    <script>
      function togglePassword() {
        const password = document.getElementById("password");
        const icon = event.target;
        if (password.type === "password") {
          password.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          password.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          showNotification("Iniciando sesión...", "info");

          try {
            const response = await fetch(
              "../../../backend/public/index.php?route=auth/login",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password }),
              },
            );

            const data = await response.json();

            if (data.success) {
              localStorage.setItem("token", data.token);
              localStorage.setItem("user", JSON.stringify(data.user));
              showNotification("¡Login correcto! Redirigiendo...", "success");
              setTimeout(() => {
                window.location.href = "../dashboard.html";
              }, 1500);
            } else {
              showNotification(data.message, "error");
            }
          } catch (error) {
            console.error(error);
            showNotification("Error de conexión: " + error.message, "error");
          }
        });

      function loginWithGoogle() {
        const GOOGLE_CLIENT_ID =
          "558764914281-cklberlvgkjd04d9fhmo2umuq9eudp4j.apps.googleusercontent.com";

        const redirectUri = encodeURIComponent(
          "http://localhost/backend/auth/google-oauth.php",
        );

        const url = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CLIENT_ID}&redirect_uri=${redirectUri}&response_type=token&scope=email%20profile%20openid`;

        window.location.href = url;
      }

      function showNotification(message, type = "info") {
        const container = document.getElementById("notification-container");
        const notification = document.createElement("div");
        notification.className = `notification ${type}`;

        const icon = {
          success: "fa-check-circle",
          error: "fa-exclamation-circle",
          info: "fa-info-circle",
        }[type];

        notification.innerHTML = `
                  <i class="fas ${icon}"></i>
                  <span>${message}</span>
              `;

        container.appendChild(notification);

        setTimeout(() => {
          notification.style.animation = "slideOut 0.3s ease";
          setTimeout(() => notification.remove(), 300);
        }, 3000);
      }
    </script>
  </body>
</html>
