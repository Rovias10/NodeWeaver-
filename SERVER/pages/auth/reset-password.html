<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restablecer Contraseña - NodeWeaver</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="../../css/tailwind.css" />
    <style>
      @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
      .grid-pattern {
        background-image:
          linear-gradient(rgba(139, 92, 246, 0.1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(139, 92, 246, 0.1) 1px, transparent 1px);
        background-size: 80px 80px;
      }
    </style>
  </head>
  <body class="bg-[#0a0a0f] text-white min-h-screen font-sans antialiased flex items-center justify-center p-4 relative overflow-hidden isolate">
    
    <!-- Seamless Flowing Background Elements - GLOBAL PARA TODO EL SITIO -->
    <div class="fixed inset-0 bg-[#0a0a0f] z-[-10] pointer-events-none"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-purple-900/20 via-pink-900/10 to-[#0a0a0f] z-[-9] pointer-events-none"></div>
    <div class="fixed inset-0 grid-pattern opacity-25 z-[-8] pointer-events-none"></div>

    <!-- Warm Ambient Background Glows -->
    <div class="absolute top-[-15%] left-[-10%] w-[50%] h-[50%] rounded-full bg-amber-500/10 blur-[140px] pointer-events-none z-[-7]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-pink-600/15 blur-[120px] pointer-events-none z-[-7]"></div>
    <div class="absolute top-[20%] right-[30%] w-[30%] h-[30%] rounded-full bg-cyan-500/10 blur-[130px] pointer-events-none z-[-7]"></div>

    <div class="w-full max-w-md p-8 md:p-10 my-8 bg-slate-800/40 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-2xl shadow-black/40 z-10 transition-all duration-300">
      <div class="text-center mb-8">
        <object type="image/svg+xml" data="../../assets/nodeweaver-logo.svg" class="w-16 h-16 mx-auto mb-4 drop-shadow-[0_0_15px_rgba(236,72,153,0.4)] pointer-events-none"></object>
        <h2 class="text-2xl font-bold text-white mb-2">Nueva Contraseña</h2>
        <p class="text-slate-400 text-sm">Crea una nueva contraseña segura</p>
      </div>

      <div id="errorContainer" class="hidden items-center justify-center gap-2 p-4 mb-6 rounded-xl bg-red-500/10 border border-red-500/50 text-red-400 text-sm font-medium animate-[slideIn_0.3s_ease-out_forwards]">
        <i class="fas fa-exclamation-circle text-lg"></i>
        <span id="errorText">El enlace no es válido.</span>
      </div>

      <div id="successContainer" class="hidden items-center justify-center flex-col gap-4 p-8 mb-6 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-center animate-[slideIn_0.3s_ease-out_forwards]">
        <i class="fas fa-check-circle text-5xl mb-2 drop-shadow-[0_0_15px_rgba(16,185,129,0.5)]"></i>
        <span class="text-lg font-bold">¡Contraseña actualizada!</span>
        <p class="text-sm text-emerald-200/70">Tu contraseña ha sido restaurada con éxito.</p>
        <a href="login.html" class="mt-4 bg-gradient-to-r from-emerald-600 to-green-500 hover:shadow-lg hover:shadow-emerald-500/50 text-white font-bold py-3 px-6 rounded-xl flex items-center justify-center gap-2 transition-all transform hover:-translate-y-0.5">
          <i class="fas fa-sign-in-alt"></i> Ir al Login
        </a>
      </div>

      <form id="resetForm" class="flex flex-col gap-6">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Nueva contraseña</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input type="password" id="password" class="w-full bg-slate-900/50 border border-white/10 rounded-xl pl-11 pr-10 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-pink-500/50 transition-all shadow-inner" placeholder="Mínimo 6 caracteres" required />
            <i class="fas fa-eye absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 cursor-pointer hover:text-white" onclick="togglePassword('password')"></i>
          </div>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Confirmar nueva contraseña</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input type="password" id="confirmPassword" class="w-full bg-slate-900/50 border border-white/10 rounded-xl pl-11 pr-10 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-pink-500/50 transition-all shadow-inner" placeholder="Repite la contraseña" required />
            <i class="fas fa-eye absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 cursor-pointer hover:text-white" onclick="togglePassword('confirmPassword')"></i>
          </div>
          <div class="hidden text-red-500 text-xs mt-2 font-medium" id="confirmError"><i class="fas fa-times-circle"></i> Las contraseñas no coinciden</div>
        </div>

        <button type="submit" id="submitBtn" class="w-full mt-2 bg-gradient-to-r from-purple-600 via-pink-600 to-cyan-600 hover:shadow-lg hover:shadow-purple-500/50 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all transform hover:-translate-y-0.5">
          <i class="fas fa-save"></i> Guardar contraseña
        </button>
      </form>

      <div class="mt-8 text-center text-sm">
        <a href="login.html" class="flex items-center justify-center gap-2 text-slate-400 hover:text-white transition-colors group">
          <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i> Volver al inicio de sesión
        </a>
      </div>
    </div>

    <!-- Notification Engine -->
    <div id="notification-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3"></div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        document.getElementById("errorContainer").classList.remove("hidden");
        document.getElementById("errorContainer").classList.add("flex");
        document.getElementById("errorText").innerText = "Falta el token de seguridad. Usa el enlace completo de tu correo.";
        document.getElementById("resetForm").classList.add("hidden");
        document.getElementById("submitBtn").disabled = true;
      }

      function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = event.target;
        if (field.type === "password") {
          field.type = "text";
          icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
          field.type = "password";
          icon.classList.replace("fa-eye-slash", "fa-eye");
        }
      }

      document.getElementById("resetForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const password = document.getElementById("password").value;
          const confirmPassword = document.getElementById("confirmPassword").value;
          const btn = document.getElementById("submitBtn");
          const errorMsg = document.getElementById("confirmError");

          if (password !== confirmPassword) {
            errorMsg.classList.remove("hidden");
            document.getElementById("confirmPassword").classList.add("border-red-500");
            return;
          } else {
            errorMsg.classList.add("hidden");
            document.getElementById("confirmPassword").classList.remove("border-red-500");
          }

          if (password.length < 6) {
            showNotification("La contraseña debe tener al menos 6 caracteres", "error");
            return;
          }

          btn.disabled = true;
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';

          try {
            const response = await fetch("../../../API/index.php?route=auth/reset-password", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, password }),
            });
            const data = await response.json();

            if (data.success) {
              document.getElementById("successContainer").classList.remove("hidden");
              document.getElementById("successContainer").classList.add("flex");
              document.getElementById("resetForm").classList.add("hidden");
            } else {
              showNotification(data.message, "error");
              btn.disabled = false;
              btn.innerHTML = '<i class="fas fa-save"></i> Guardar contraseña';
            }
          } catch (error) {
            showNotification("Error de conexión", "error");
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-save"></i> Guardar contraseña';
          }
      });

      function showNotification(message, type = "info") {
        const container = document.getElementById("notification-container");
        const notif = document.createElement("div");
        let bg = type === "success" ? "bg-emerald-500/10 border-emerald-500/50 text-emerald-400" : type === "error" ? "bg-red-500/10 border-red-500/50 text-red-400" : "bg-cyan-500/10 border-cyan-500/50 text-cyan-400";
        let icon = type === "success" ? "fa-check-circle" : type === "error" ? "fa-exclamation-circle" : "fa-info-circle";
        notif.className = `flex items-center gap-3 px-5 py-4 rounded-xl border backdrop-blur-md shadow-lg min-w-[300px] ${bg} animate-[slideIn_0.3s_ease-out_forwards]`;
        notif.innerHTML = `<i class="fas ${icon} text-xl"></i><span class="font-medium text-sm text-white">${message}</span>`;
        container.appendChild(notif);
        setTimeout(() => { notif.style.animation = "slideOut 0.3s ease-in forwards"; setTimeout(() => notif.remove(), 300); }, 3000);
      }
    </script>
  </body>
</html>
