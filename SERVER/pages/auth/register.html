<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Cuenta - NodeWeaver</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="../../css/tailwind.css" />
    <style>
      @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
      .grid-pattern {
        background-image:
          linear-gradient(rgba(139, 92, 246, 0.1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(139, 92, 246, 0.1) 1px, transparent 1px);
        background-size: 80px 80px;
      }
    </style>
  </head>
  <body class="bg-[#0a0a0f] text-white min-h-screen font-sans antialiased flex items-center justify-center p-4 relative overflow-hidden isolate">
    
    <!-- Seamless Flowing Background Elements - GLOBAL PARA TODO EL SITIO -->
    <div class="fixed inset-0 bg-[#0a0a0f] z-[-10] pointer-events-none"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-purple-900/20 via-pink-900/10 to-[#0a0a0f] z-[-9] pointer-events-none"></div>
    <div class="fixed inset-0 grid-pattern opacity-25 z-[-8] pointer-events-none"></div>

    <!-- Warm Ambient Background Glows -->
    <div class="absolute top-[-15%] left-[-10%] w-[50%] h-[50%] rounded-full bg-amber-500/10 blur-[140px] pointer-events-none z-[-7]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-pink-600/15 blur-[120px] pointer-events-none z-[-7]"></div>
    <div class="absolute top-[20%] right-[30%] w-[30%] h-[30%] rounded-full bg-cyan-500/10 blur-[130px] pointer-events-none z-[-7]"></div>

    <div class="w-full max-w-2xl p-8 md:p-10 my-8 bg-slate-800/40 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-2xl shadow-black/40 z-10">
      <div class="text-center mb-8">
        <object type="image/svg+xml" data="../../assets/nodeweaver-logo.svg" class="w-16 h-16 mx-auto mb-4 drop-shadow-[0_0_15px_rgba(236,72,153,0.4)] pointer-events-none"></object>
        <h2 class="text-2xl font-bold text-white mb-2">Crear tu cuenta</h2>
        <p class="text-slate-400 text-sm">Empieza a automatizar en segundos</p>
      </div>

      <form id="registerForm" novalidate class="flex flex-col gap-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Col 1 -->
          <div class="flex flex-col gap-5">
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1.5">Nombre completo</label>
              <div class="relative">
                <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="text" id="name" class="w-full bg-slate-900/50 border border-white/10 rounded-xl pl-11 pr-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-pink-500/50 transition-all shadow-inner" placeholder="Juan Pérez" required />
              </div>
              <div class="hidden text-red-500 text-xs mt-1" id="nameError">El nombre es requerido</div>
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1.5">Email</label>
              <div class="relative">
                <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="email" id="email" class="w-full bg-slate-900/50 border border-white/10 rounded-xl pl-11 pr-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-pink-500/50 transition-all shadow-inner" placeholder="tu@email.com" required />
              </div>
              <div class="hidden text-red-500 text-xs mt-1" id="emailError">Email inválido</div>
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1.5">Contraseña</label>
              <div class="relative">
                <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="password" id="password" class="w-full bg-slate-900/50 border border-white/10 rounded-xl pl-11 pr-10 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-pink-500/50 transition-all shadow-inner" placeholder="Mínimo 6 caracteres" required />
                <i class="fas fa-eye absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 cursor-pointer hover:text-white" onclick="togglePassword('password')"></i>
              </div>
              <div class="h-1 w-full bg-slate-800 rounded-full mt-2 overflow-hidden"><div class="h-full bg-red-500 w-0 transition-all duration-300" id="strengthBar"></div></div>
              <div class="text-xs text-red-500 mt-1 font-medium" id="strengthText">Muy débil</div>
              <div class="hidden text-red-500 text-xs mt-1" id="passwordError">Mín. 6 caracteres</div>
            </div>
          </div>

          <!-- Col 2 -->
          <div class="flex flex-col gap-5">
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1.5">Empresa (Opcional)</label>
              <div class="relative">
                <i class="fas fa-building absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="text" id="company" class="w-full bg-slate-900/50 border border-white/10 rounded-xl pl-11 pr-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-pink-500/50 transition-all shadow-inner" placeholder="Mi Empresa S.L." />
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1.5">Teléfono (Opcional)</label>
              <div class="relative">
                <i class="fas fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="tel" id="phone" class="w-full bg-slate-900/50 border border-white/10 rounded-xl pl-11 pr-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-pink-500/50 transition-all shadow-inner" placeholder="+34 600 000 000" />
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1.5">Confirmar contraseña</label>
              <div class="relative">
                <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="password" id="confirmPassword" class="w-full bg-slate-900/50 border border-white/10 rounded-xl pl-11 pr-10 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-pink-500/50 transition-all shadow-inner" placeholder="Repite contraseña" required />
                <i class="fas fa-eye absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 cursor-pointer hover:text-white" onclick="togglePassword('confirmPassword')"></i>
              </div>
              <div class="hidden text-red-500 text-xs mt-1" id="confirmError">No coinciden</div>
              <div class="hidden text-emerald-500 text-xs mt-1" id="confirmSuccess">✓ Coinciden</div>
            </div>
          </div>
        </div>

        <div class="mt-2">
          <label class="flex items-start gap-3 cursor-pointer">
            <input type="checkbox" id="terms" class="mt-1 w-4 h-4 rounded border-slate-600 text-pink-500 focus:ring-pink-500 focus:ring-2 focus:ring-offset-0 bg-slate-900 appearance-none checked:bg-pink-500" required />
            <span class="text-sm text-slate-400">Acepto los <a href="#" class="text-pink-400 hover:text-pink-300 hover:underline">Términos y Condiciones</a> y la <a href="#" class="text-pink-400 hover:text-pink-300 hover:underline">Política de Privacidad</a></span>
          </label>
          <div class="hidden text-red-500 text-xs mt-1 ml-7" id="termsError">Debes aceptar los términos</div>
        </div>

        <button type="submit" id="submitBtn" class="w-full mt-2 bg-gradient-to-r from-purple-600 via-pink-600 to-cyan-600 hover:shadow-lg hover:shadow-purple-500/50 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all transform hover:-translate-y-0.5">
          <i class="fas fa-user-plus"></i> Crear cuenta gratis
        </button>

        <div class="relative flex items-center py-2">
          <div class="flex-grow border-t border-white/10"></div>
          <span class="flex-shrink-0 mx-4 text-slate-500 text-sm">o</span>
          <div class="flex-grow border-t border-white/10"></div>
        </div>

        <button type="button" onclick="loginWithGoogle()" class="w-full bg-white/5 hover:bg-white/10 border border-white/10 text-white font-medium py-3 rounded-xl flex items-center justify-center gap-2 transition-all">
          <i class="fab fa-google text-lg"></i> Registrarse con Google
        </button>
      </form>

      <div class="mt-8 text-center text-sm text-slate-400">
        ¿Ya tienes una cuenta? <a href="login.html" class="bg-gradient-to-r from-purple-400 to-cyan-400 bg-clip-text text-transparent hover:from-purple-300 hover:to-cyan-300 font-bold ml-1 transition-all">Inicia sesión</a>
      </div>
    </div>

    <!-- Notification Engine -->
    <div id="notification-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3"></div>

    <script>
      const API_URL = "../../../API/index.php?route=auth/register";
      
      const inputs = {
        name: document.getElementById("name"),
        email: document.getElementById("email"),
        company: document.getElementById("company"),
        phone: document.getElementById("phone"),
        password: document.getElementById("password"),
        confirmText: document.getElementById("confirmPassword"),
        terms: document.getElementById("terms")
      };

      function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = event.target;
        if (field.type === "password") {
          field.type = "text";
          icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
          field.type = "password";
          icon.classList.replace("fa-eye-slash", "fa-eye");
        }
      }

      inputs.password.addEventListener("input", function () {
        const pass = this.value;
        const b = document.getElementById("strengthBar");
        const t = document.getElementById("strengthText");
        let s = 0, c = "#ef4444", txt = "Muy débil"; // Tailwind red-500
        
        if (pass.length >= 6) s++;
        if (pass.length >= 10) s++;
        if (/[A-Z]/.test(pass)) s++;
        if (/[0-9]/.test(pass)) s++;
        if (/[^A-Za-z0-9]/.test(pass)) s++;

        if (s===2) { c="#f97316"; txt="Débil"; } // orange-500
        if (s===3) { c="#eab308"; txt="Media"; } // yellow-500
        if (s===4) { c="#10b981"; txt="Fuerte"; } // emerald-500
        if (s===5) { c="#059669"; txt="Muy fuerte"; } // emerald-600

        b.style.width = (s * 20 || 5) + "%";
        b.style.backgroundColor = c;
        t.textContent = txt;
        t.style.color = c;
      });

      function valMatch() {
        const p = inputs.password.value, c = inputs.confirmText.value;
        const err = document.getElementById("confirmError"), suc = document.getElementById("confirmSuccess");
        if (!c) { err.classList.add("hidden"); suc.classList.add("hidden"); return false; }
        if (p === c) { err.classList.add("hidden"); suc.classList.remove("hidden"); return true; } 
        else { err.classList.remove("hidden"); suc.classList.add("hidden"); return false; }
      }
      inputs.password.addEventListener("keyup", valMatch);
      inputs.confirmText.addEventListener("keyup", valMatch);

      inputs.email.addEventListener("input", function () {
        const err = document.getElementById("emailError");
        if (this.value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.value)) {
          err.classList.remove("hidden"); this.classList.add("border-red-500");
        } else {
          err.classList.add("hidden"); this.classList.remove("border-red-500");
        }
      });

      document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        document.querySelectorAll("[id$='Error']").forEach(el => el.classList.add("hidden"));
        document.querySelectorAll("input").forEach(el => el.classList.remove("border-red-500"));
        
        let valid = true;
        
        if (!inputs.name.value.trim()) { document.getElementById("nameError").classList.remove("hidden"); inputs.name.classList.add("border-red-500"); valid = false; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(inputs.email.value)) { document.getElementById("emailError").classList.remove("hidden"); inputs.email.classList.add("border-red-500"); valid = false; }
        if (inputs.password.value.length < 6) { document.getElementById("passwordError").classList.remove("hidden"); inputs.password.classList.add("border-red-500"); valid = false; }
        if (inputs.password.value !== inputs.confirmText.value) { document.getElementById("confirmError").classList.remove("hidden"); inputs.confirmText.classList.add("border-red-500"); valid = false; }
        if (!inputs.terms.checked) { document.getElementById("termsError").classList.remove("hidden"); valid = false; }

        if (!valid) return showNotification("Por favor, corrige los errores", "error");

        const btn = document.getElementById("submitBtn");
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creando cuenta...';
        showNotification("Creando tu cuenta...", "info");

        try {
          const res = await fetch(API_URL, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: inputs.name.value, email: inputs.email.value, password: inputs.password.value, company_name: inputs.company.value, phone: inputs.phone.value })
          });
          const data = await res.json();
          if (data.success) {
            localStorage.setItem("token", data.token); localStorage.setItem("user", JSON.stringify(data.user));
            showNotification("¡Cuenta creada! Redirigiendo...", "success");
            setTimeout(() => window.location.href = "../dashboard.html", 2000);
          } else {
            showNotification(data.message || "Error al crear la cuenta", "error");
            btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus"></i> Crear cuenta gratis';
          }
        } catch (error) {
          showNotification("Error de conexión", "error");
          btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus"></i> Crear cuenta gratis';
        }
      });

      function loginWithGoogle() {}
      
      function showNotification(message, type = "info") {
        const container = document.getElementById("notification-container");
        const notif = document.createElement("div");
        let bg = type === "success" ? "bg-emerald-500/10 border-emerald-500/50 text-emerald-400" : type === "error" ? "bg-red-500/10 border-red-500/50 text-red-400" : "bg-cyan-500/10 border-cyan-500/50 text-cyan-400";
        let icon = type === "success" ? "fa-check-circle" : type === "error" ? "fa-exclamation-circle" : "fa-info-circle";
        notif.className = `flex items-center gap-3 px-5 py-4 rounded-xl border backdrop-blur-md shadow-lg min-w-[300px] ${bg} animate-[slideIn_0.3s_ease-out_forwards]`;
        notif.innerHTML = `<i class="fas ${icon} text-xl"></i><span class="font-medium text-sm text-white">${message}</span>`;
        container.appendChild(notif);
        setTimeout(() => { notif.style.animation = "slideOut 0.3s ease-in forwards"; setTimeout(() => notif.remove(), 300); }, 3000);
      }
    </script>
  </body>
</html>
