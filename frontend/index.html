<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudyWeaver — estudia con mapas conceptuales generados por IA, flashcards y comunidad." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <!--
      Tipografía del sistema de diseño "Cielo Claro":
        · Fraunces  → titulares (carácter editorial, sirve de contraste con la UI utilitaria).
        · Manrope   → cuerpo (sans humanista, mejor legibilidad en pantalla que Inter).
      Preconnect ahorra el handshake TLS contra los CDN de Google Fonts.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <title>StudyWeaver</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Google Identity Services (GIS). Lo cargamos aquí para que esté
      disponible cuando el componente GoogleButton intente renderizar
      el botón oficial. async + defer = no bloquea el render del shell.
    -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
